<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#E6F7F5" opacity="0.6"/>
  <circle cx="1100" cy="530" r="180" fill="#B3E8E0" opacity="0.4"/>

  <!-- Main content area -->
  <rect x="80" y="150" width="1040" height="380" fill="white" rx="16" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="250" font-family="Georgia, serif" font-size="64" font-weight="300" text-anchor="middle" fill="#111827">
    Global Economic Index
  </text>

  <!-- Subtitle -->
  <text x="600" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" text-anchor="middle" fill="#4B5563">
    AI Adoption Patterns Worldwide
  </text>

  <!-- Stats -->
  <g transform="translate(200, 360)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="240" height="100" fill="#F0FDFA" rx="8"/>
    <text x="120" y="45" font-family="Georgia, serif" font-size="40" font-weight="300" text-anchor="middle" fill="#117763">173</text>
    <text x="120" y="75" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#6B7280">Countries</text>

    <!-- Stat 2 -->
    <rect x="280" y="0" width="240" height="100" fill="#F0FDFA" rx="8"/>
    <text x="400" y="45" font-family="Georgia, serif" font-size="40" font-weight="300" text-anchor="middle" fill="#117763">974</text>
    <text x="400" y="75" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#6B7280">Job Categories</text>

    <!-- Stat 3 -->
    <rect x="560" y="0" width="240" height="100" fill="#F0FDFA" rx="8"/>
    <text x="680" y="45" font-family="Georgia, serif" font-size="40" font-weight="300" text-anchor="middle" fill="#117763">1M+</text>
    <text x="680" y="75" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#6B7280">Conversations</text>
  </g>

  <!-- Footer -->
  <text x="600" y="580" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle" fill="#9CA3AF">
    Based on Anthropic Economic Index V3
  </text>
</svg>
